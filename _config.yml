# Site settings
title: "Brock Whitbread-Cole"
email: brock.whitbread@gmail.com
description: >
    Notes, project updates, and a build log from Brock Whitbread-Cole, a software
    engineer finishing his CS degree at the University of Colorado Boulder.
baseurl: "" # user site deploys at the domain root
url: "https://brockwc.github.io"
twitter_username: zapRowsdowr
github_username:  brockwc

# Build settings
markdown: kramdown
highlighter: rouge
timezone: America/Los_Angeles

# Include supported plugins
plugins:
- jekyll-mentions
- jemoji
- jekyll-redirect-from
- jekyll-sitemap
- jekyll-feed

# Keep build tooling out of the published site
exclude:
- Gemfile
- Gemfile.lock
- package.json
- package-lock.json
- README.md
- css/tailwind.src.css
- node_modules
- vendor
