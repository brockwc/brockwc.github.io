<footer class="border-t border-zinc-200 dark:border-zinc-800">

    <p>&copy; {{ site.time | date: "%Y" }} Brock Whitbread-Cole</p>
    <div class="flex items-center gap-5">
      <a href="https://github.com/{{ site.github_username }}" class="transition-colors hover:text-zinc-900 dark:hover:text-zinc-100">GitHub</a>
      <a href="mailto:{{ site.email }}" class="transition-colors hover:text-zinc-900 dark:hover:text-zinc-100">Email</a>
      <a href="{{ '/feed.xml' | prepend: site.baseurl }}" class="transition-colors hover:text-zinc-900 dark:hover:text-zinc-100">RSS</a>

  </div>
</footer>
