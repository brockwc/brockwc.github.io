<header class="sticky top-0 z-10 border-b border-zinc-200/80 bg-zinc-50/80 backdrop-blur dark:border-zinc-800/80 dark:bg-zinc-950/80">
  <nav class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-6 py-4">
    <a href="{{ '/' | prepend: site.baseurl }}" class="font-semibold tracking-tight text-zinc-900 dark:text-zinc-50">{{ site.title }}</a>

    <div class="flex items-center gap-4 text-sm sm:gap-5">
      <a href="{{ '/categories/' | prepend: site.baseurl }}"{% if page.url contains '/categories' %} aria-current="page"{% endif %} class="transition-colors hover:text-zinc-900 dark:hover:text-zinc-100 {% if page.url contains '/categories' %}font-medium text-zinc-900 dark:text-zinc-100{% else %}text-zinc-600 dark:text-zinc-400{% endif %}">Posts</a>
      <a href="{{ '/about/' | prepend: site.baseurl }}"{% if page.url contains '/about' %} aria-current="page"{% endif %} class="transition-colors hover:text-zinc-900 dark:hover:text-zinc-100 {% if page.url contains '/about' %}font-medium text-zinc-900 dark:text-zinc-100{% else %}text-zinc-600 dark:text-zinc-400{% endif %}">About</a>
      <a href="https://github.com/{{ site.github_username }}" aria-label="GitHub profile" class="text-zinc-500 transition-colors hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block h-[18px] w-[18px]" aria-hidden="true"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      </a>
      <a href="{{ '/feed.xml' | prepend: site.baseurl }}" aria-label="RSS feed" class="text-zinc-500 transition-colors hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="block h-[18px] w-[18px]" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
      </a>
    </div>
  </nav>
</header>
